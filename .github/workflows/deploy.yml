name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      dry_run:
        description: 'Only assume the deploy role, log in to ECR, open the database tunnel and log in to the database with an IAM token, then stop (no build, no migration, no deploy)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  # The role both jobs assume; written once so a rename cannot leave one job pointing at the old name.
  DEPLOY_ROLE_ARN: arn:aws:iam::327317202676:role/github-deploy-bookplayer-api
  ECR_REPOSITORY: bookplayer-api
  ECS_CLUSTER: bookplayer-cluster
  ECS_SERVICE: bookplayer-api
  CONTAINER_NAME: bookplayer-api
  # The database has no public address. The migration step reaches it through a Session Manager port-forward on the
  # bastion; the deploy role may start a session on THIS instance with THAT document only, and look up THIS
  # instance's endpoint. Nothing here is secret — the tunnel is authenticated by the role, the database by DB_*.
  BASTION_INSTANCE_ID: i-029cec6605709e94d
  RDS_INSTANCE: bookplayer-db
  # Non-default local port: nothing on the runner can already be listening there, so the readiness probe can only be
  # answered through this tunnel. knexfile.ts reads it as DB_PORT (default 5432).
  DB_TUNNEL_PORT: '15432'
  # The Session Manager plugin is not on the runner image; pinned by version AND checksum, like the actions.
  # Bump both together: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/VERSION
  SSM_PLUGIN_VERSION: 1.2.835.0
  SSM_PLUGIN_SHA256: 0add94c4c8b6ca63f26e44fd655d662b0f6455a268b5b9ebebee0f462214e928
  # The migration step authenticates with an RDS IAM token minted by the deploy role (`rds-db:connect` on this one
  # database user), not a password: no database credential lives in GitHub. The user is a member of `rds_iam` and of
  # the schema owner `bpadmin2022`, and every session starts as that owner (`ALTER ROLE ... SET role`), so ALTERs
  # work and new tables are owned like the existing ones. Neither value is secret.
  DB_MIGRATION_USER: migrator_iam
  DB_NAME: bookplayer-db

jobs:
  # The credential model, shared by both jobs: the job requests a GitHub OIDC token and assumes
  # `github-deploy-bookplayer-api`, whose trust policy accepts only a token minted for THIS repository's `production`
  # environment (deployment-branch policy `main`) and whose permissions are exactly the deploy's — push to the
  # bookplayer-api ECR repository, register a task definition, update the bookplayer-api service, pass its two task
  # roles, port-forward through the bastion to the database, describe that database instance, connect to it as the
  # migration user with an IAM token. A repository secret with an access key was readable by anyone who could edit a workflow; a token exists
  # for the minutes the job runs and only for a run the environment admits.
  #
  # Two jobs, one gate each. `verify-credentials` runs only for a dry run and stops after proving the role and the
  # ECR login. `deploy` runs only for a real dispatch AND only from `main` — the in-repo half of the guard, so a
  # misconfigured environment policy alone can never let a branch migrate or deploy production. A step added to
  # `deploy` later cannot forget a per-step guard, because there is none to forget. `guard` turns the case where
  # neither job would run — a real dispatch from a branch — into a red run with a message, not a silent no-op.
  guard:
    name: Real deploys run from main only
    if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Real deploys only run from main (this run is ${{ github.ref }}). Use dry_run to verify credentials from a branch."
          exit 1

  # `verify-credentials` has no ref condition on purpose — it exists to verify credentials from a branch — which
  # means the `production` environment's deployment-branch policy is the ONLY thing stopping a branch-edited copy
  # of this job from assuming the deploy role. Keep that policy at `main` (widen it deliberately and briefly when
  # a branch has to be verified, then restore it), and keep the role's permissions to what the deploy needs.
  verify-credentials:
    name: Dry run — assume the deploy role, log in to ECR, reach the database through the bastion
    if: ${{ inputs.dry_run }}
    # Same runner as the deploy: the tunnel action pins the arm64 plugin build, and the dry run should exercise the
    # exact steps the deploy will.
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write   # to request the OIDC token
      contents: read
    steps:
      # For the local tunnel action below. That action's shell runs from the selected ref with the deploy role's
      # credentials — no different from the workflow file itself under `workflow_dispatch`, and the same gate applies:
      # the environment's deployment-branch policy (see above) is what constrains which ref gets here.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-verify-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # The login IS the ECR proof (GetAuthorizationToken, which the deploy needs); the ECS probe uses
      # DescribeServices, which `wait-for-service-stability` needs. Nothing the deploy does not use.
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Who am I, and is the service reachable
        run: |
          aws sts get-caller-identity
          # describe-services exits 0 for a missing or misnamed service (empty `services`, a `failures` entry), so the
          # status is asserted rather than printed.
          status=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].status' --output text)
          if [ "$status" != "ACTIVE" ]; then echo "::error::service $ECS_CLUSTER/$ECS_SERVICE is not ACTIVE (got: $status)"; exit 1; fi
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].[serviceName,status,taskDefinition]' --output text

      # Everything that executes third-party code runs BEFORE the tunnel exists, and with install scripts off: this job
      # has no ref condition (see above), so a branch-controlled lockfile must never get to run while the deploy role's
      # credentials and a path to the production database are both in the environment. Only `pg` (pure JS) is needed.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Fetch the RDS CA bundle
        uses: ./.github/actions/rds-ca-bundle

      # The same action the deploy uses, so the dry run proves StartSession on the bastion, the endpoint lookup, the
      # plugin pin and that a PostgreSQL server answers through the tunnel — without credentials and without a query.
      - name: Open the database tunnel
        id: tunnel
        timeout-minutes: 3
        uses: ./.github/actions/rds-tunnel
        with:
          bastion-instance-id: ${{ env.BASTION_INSTANCE_ID }}
          rds-instance: ${{ env.RDS_INSTANCE }}
          local-port: ${{ env.DB_TUNNEL_PORT }}
          plugin-version: ${{ env.SSM_PLUGIN_VERSION }}
          plugin-sha256: ${{ env.SSM_PLUGIN_SHA256 }}

      # A 15-minute token for the endpoint NAME (the token is bound to the endpoint, not to the address the client
      # connects through, so it is valid across the tunnel). Signed locally; no API call, so a missing `rds-db:connect`
      # shows up only at login — which is exactly what the next step tests. Minted immediately before its only use.
      - name: Mint a database token
        id: db-token
        env:
          RDS_HOST: ${{ steps.tunnel.outputs.host }}
        run: |
          token=$(aws rds generate-db-auth-token --hostname "$RDS_HOST" --port 5432 --username "$DB_MIGRATION_USER")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # The deploy's exact credentials and path, minus the migration: `rds-db:connect` on the role, the database user's
      # IAM membership, that a session starts as the schema owner, and that the server presents a certificate for the
      # endpoint name signed by the RDS CA. Read-only; nothing is migrated in a dry run.
      - name: Log in to the database with the IAM token
        timeout-minutes: 2
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ env.DB_TUNNEL_PORT }}
          DB_USER: ${{ env.DB_MIGRATION_USER }}
          DB_PASSWORD: ${{ steps.db-token.outputs.token }}
          DB_DATABASE: ${{ env.DB_NAME }}
          DB_SSL_CA: ${{ runner.temp }}/rds-global-bundle.pem
          DB_SSL_SERVERNAME: ${{ steps.tunnel.outputs.host }}
        run: |
          node -e '
            const { Client } = require("pg");
            const { readFileSync } = require("fs");
            const c = new Client({ host: process.env.DB_HOST, port: Number(process.env.DB_PORT), user: process.env.DB_USER,
              password: process.env.DB_PASSWORD, database: process.env.DB_DATABASE,
              ssl: { ca: readFileSync(process.env.DB_SSL_CA, "utf8"), servername: process.env.DB_SSL_SERVERNAME, rejectUnauthorized: true } });
            c.connect()
              .then(() => c.query("select session_user, current_user"))
              .then((r) => { console.log(`IAM login ok over a verified TLS session: session_user=${r.rows[0].session_user} current_user=${r.rows[0].current_user}`);
                if (r.rows[0].current_user !== "bpadmin2022") { console.error("::error::session did not start as the schema owner"); process.exit(1); }
                return c.end(); })
              .catch((e) => { console.error("::error::" + e.message); process.exit(1); });
          '

      # Always, and from the pid FILE: the step output exists only if the tunnel step succeeded, and a tunnel that
      # failed halfway can still be holding a session. The plugin is a child of the CLI wrapper and is commonly
      # reparented when only the wrapper dies, so the child goes first.
      - name: Close the database tunnel
        if: always()
        run: |
          pidfile="$RUNNER_TEMP/ssm-tunnel.pid"
          if [ ! -f "$pidfile" ]; then echo "no tunnel to close"; exit 0; fi
          pid=$(cat "$pidfile")
          pkill -P "$pid" 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          rm -f "$pidfile"
          echo "tunnel closed"

      - name: Dry run complete
        run: |
          echo "dry run complete: trust policy, ECR login, ECS read access, the database tunnel and the IAM database login verified; RegisterTaskDefinition and PassRole are first exercised by the real deploy. Nothing built, migrated or deployed."

  deploy:
    name: Build and Deploy to ECS
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    # A native arm64 runner: the image is linux/arm64 and used to be built under QEMU on an x86 runner, which
    # crashed `yarn install` with SIGILL (exit 132) once the node:20-alpine base moved — Node's JIT under user-mode
    # emulation. Building where the image runs removes the emulator, and the build with it takes a third of the time.
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write   # to request the OIDC token
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run additive DB migrations BEFORE the new task set takes traffic, so the
      # deployed code never references a column/table that doesn't exist yet.
      # Additive migrations are backward-compatible, so the currently-running
      # tasks tolerate them. If this step fails the deploy stops here and the old
      # tasks keep serving — we never ship code ahead of its schema.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch the RDS CA bundle
        uses: ./.github/actions/rds-ca-bundle

      - name: Open the database tunnel
        id: tunnel
        timeout-minutes: 3
        uses: ./.github/actions/rds-tunnel
        with:
          bastion-instance-id: ${{ env.BASTION_INSTANCE_ID }}
          rds-instance: ${{ env.RDS_INSTANCE }}
          local-port: ${{ env.DB_TUNNEL_PORT }}
          plugin-version: ${{ env.SSM_PLUGIN_VERSION }}
          plugin-sha256: ${{ env.SSM_PLUGIN_SHA256 }}

      - name: Mint a database token
        id: db-token
        env:
          RDS_HOST: ${{ steps.tunnel.outputs.host }}
        run: |
          token=$(aws rds generate-db-auth-token --hostname "$RDS_HOST" --port 5432 --username "$DB_MIGRATION_USER")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # Under the token's 15-minute validity: a connection knex opened after expiry would fail mid-run, so the step
      # ends first.
      - name: Run database migrations
        timeout-minutes: 10
        # NODE_ENV is intentionally left unset: knexfile.ts only defines a
        # `development` block (which reads the connection from env vars below),
        # and knex defaults to that block. Setting NODE_ENV=production would make
        # knex look for a non-existent `production` config and fail.
        run: npx knex migrate:latest --knexfile knexfile.ts
        env:
          # The local end of the tunnel. `127.0.0.1` rather than `localhost` on purpose: knexfile.ts turns TLS off
          # for the literal string `localhost`. With DB_SSL_CA set, knexfile.ts verifies the server's certificate
          # against the RDS CA bundle for the endpoint NAME (the certificate does not name 127.0.0.1), so the bearer
          # token only ever reaches the RDS instance — not merely whatever answers at the tunnel's local end.
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ env.DB_TUNNEL_PORT }}
          DB_USER: ${{ env.DB_MIGRATION_USER }}
          DB_PASSWORD: ${{ steps.db-token.outputs.token }}
          DB_DATABASE: ${{ env.DB_NAME }}
          DB_SSL_CA: ${{ runner.temp }}/rds-global-bundle.pem
          DB_SSL_SERVERNAME: ${{ steps.tunnel.outputs.host }}

      # Always, and from the pid FILE: the step output exists only if the tunnel step succeeded, and a tunnel that
      # failed halfway can still be holding a session. The plugin is a child of the CLI wrapper and is commonly
      # reparented when only the wrapper dies, so the child goes first.
      - name: Close the database tunnel
        if: always()
        run: |
          pidfile="$RUNNER_TEMP/ssm-tunnel.pid"
          if [ ! -f "$pidfile" ]; then echo "no tunnel to close"; exit 0; fi
          pid=$(cat "$pidfile")
          pkill -P "$pid" 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          rm -f "$pidfile"
          echo "tunnel closed"

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: docker/ecs/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo "## Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | ${{ env.ECS_SERVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
