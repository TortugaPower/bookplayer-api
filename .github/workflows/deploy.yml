name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      dry_run:
        description: 'Only assume the deploy role and log in to ECR, then stop (no build, no migration, no deploy)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bookplayer-api
  ECS_CLUSTER: bookplayer-cluster
  ECS_SERVICE: bookplayer-api
  CONTAINER_NAME: bookplayer-api

jobs:
  deploy:
    name: Build and Deploy to ECS
    runs-on: ubuntu-latest
    # The job assumes an IAM role through GitHub's OIDC provider instead of holding a long-lived access key: the
    # role `github-deploy-bookplayer-api` trusts only a token minted for THIS repository's `production` environment
    # (whose deployment-branch policy is `main`), and its permissions are exactly this job's — push to the
    # bookplayer-api ECR repository, register a task definition, update the bookplayer-api service, pass its two
    # task roles. A repository secret with an access key was readable by anyone who could edit a workflow; a token
    # exists for the minutes the job runs and only for a run the environment admits.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write   # to request the OIDC token
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::327317202676:role/github-deploy-bookplayer-api
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # `dry_run`: proves the role assumption and the ECR login and stops. Used to verify a change to this job's
      # credentials without building, migrating or deploying anything.
      - name: Dry run — who am I, and can I reach ECR
        if: ${{ inputs.dry_run }}
        # Probes use permissions the real deploy needs (and the role grants), nothing wider.
        run: |
          aws sts get-caller-identity
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --max-items 1 --query 'imageDetails[0].imagePushedAt' --output text
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].[serviceName,status,taskDefinition]' --output text
          echo "dry run complete: role assumed, ECR and the ECS service reachable; stopping before build/migrate/deploy"

      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for ARM64 builds
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push Docker image
        if: ${{ !inputs.dry_run }}
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run additive DB migrations BEFORE the new task set takes traffic, so the
      # deployed code never references a column/table that doesn't exist yet.
      # Additive migrations are backward-compatible, so the currently-running
      # tasks tolerate them. If this step fails the deploy stops here and the old
      # tasks keep serving — we never ship code ahead of its schema.
      - name: Set up Node.js
        if: ${{ !inputs.dry_run }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        if: ${{ !inputs.dry_run }}
        run: yarn install --frozen-lockfile

      - name: Run database migrations
        if: ${{ !inputs.dry_run }}
        # NODE_ENV is intentionally left unset: knexfile.ts only defines a
        # `development` block (which reads the connection from env vars below),
        # and knex defaults to that block. Setting NODE_ENV=production would make
        # knex look for a non-existent `production` config and fail.
        run: npx knex migrate:latest --knexfile knexfile.ts
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}

      - name: Render Amazon ECS task definition
        if: ${{ !inputs.dry_run }}
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: docker/ecs/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to Amazon ECS
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "## Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | ${{ env.ECS_SERVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
