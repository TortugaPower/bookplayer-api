name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Jest test suite
    # The same arm64 runner the deploy uses: setup-node, `yarn install --frozen-lockfile` and `knex migrate` run
    # here on every pull request, so a tool missing from that runner image surfaces on the PR, not mid-deploy
    # after the image has been pushed.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 20

    services:
      postgres:
        # Match prod (PostgreSQL 17.7). The minor pinning is intentional —
        # bump deliberately when prod upgrades.
        image: postgres:17
        env:
          POSTGRES_USER: bookplayer
          POSTGRES_PASSWORD: bookplayer
          POSTGRES_DB: bookplayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      API_PORT: '5003'
      DB_HOST: localhost
      DB_USER: bookplayer
      DB_PASSWORD: bookplayer
      DB_DATABASE: bookplayer_test
      # Dummy values for env-schema validation. Tests don't hit these services;
      # validation just requires the variables to exist.
      S3_BUCKET: ci-dummy
      S3_REGION: us-east-1
      APPLE_CLIENT_ID: com.ci.dummy
      APP_SECRET: ci-dummy-secret
      GOOGLE_CLIENT_ID: com.ci.dummy
      ANDROID_RELEASE_HASH: hash.dummy
      REVENUECAT_HEADER: ci-dummy
      REVENUECAT_API: https://ci.dummy
      REVENUECAT_KEY: ci-dummy
      REVENUECAT_API_V2: https://ci.dummy/v2
      REVENUECAT_API_V2_KEY: ci-dummy
      REVENUECAT_PROJECT_ID: ci-dummy
      REVENUECAT_ENTITLEMENT_PRO: ci-dummy-pro
      REVENUECAT_ENTITLEMENT_PLUS: ci-dummy-plus
      REVENUECAT_ENTITLEMENT_LITE: ci-dummy-lite
      PROXY_FILE_URL: https://ci.dummy
      APP_VERSION: latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run migrations
        run: npx knex migrate:latest

      - name: Run tests
        run: yarn test

  # The production image, built natively on arm64 with push disabled: the same Dockerfile and platform the deploy
  # uses, so a Dockerfile or base-image change that cannot build on arm64 fails here, on the pull request, rather
  # than on the deploy button. Cache note: Actions cache scoping is one-way — a pull request's run reads entries
  # written from `main` but its own `cache-to` populates only the PR's scope, so the deploy is warmed by this
  # workflow's runs on pushes to `main`, never by a PR's.
  image-build:
    name: Build the production image (arm64, no push)
    runs-on: ubuntu-24.04-arm
    # Builds contributor-authored content (Dockerfile, build context): a read-only token and a cap on the runner.
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
